# ─── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ─── PostgreSQL Connection ──────────────────────────────────────────────────────
# This is the JDBC URL — tells Spring Boot where PostgreSQL is running and which database to use
spring.datasource.url=jdbc:postgresql://localhost:5432/voteit

# Your Mac username (the PostgreSQL role we confirmed with \du)
spring.datasource.username=irfan.saeed

# No password set on your local PostgreSQL
spring.datasource.password=

# The PostgreSQL JDBC driver class
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────────────
# Hibernate auto-detects PostgreSQL dialect — no need to set it explicitly
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# update  = Hibernate looks at your @Entity classes and automatically creates or
#           updates the matching tables in the database.
# This is perfect for development — you never write CREATE TABLE manually.
# In production you would use "validate" or a migration tool like Flyway instead.
spring.jpa.hibernate.ddl-auto=update

# Prints every SQL statement Hibernate runs in the console — very useful for learning
# You can see exactly what SQL is being executed behind the scenes
spring.jpa.show-sql=true

# Formats the printed SQL so it is readable (not one long line)
spring.jpa.properties.hibernate.format_sql=true

# ─── Application Name ───────────────────────────────────────────────────────────
spring.application.name=voteit
